<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Your Photo — wger</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem; margin: 0;
  }
  .card { background: #fff; color: #0f172a; border-radius: 18px; padding: 2rem 1.5rem; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .icon { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg,#dc2626,#991b1b); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.5rem; margin: 0 auto 1rem; }
  h1 { font-size: 1.1rem; margin: 0 0 0.4rem; }
  p { color: #64748b; font-size: 0.85rem; margin: 0 0 1.25rem; }
  input[type=file] { display: none; }
  .btn { display: inline-block; background: #dc2626; color: #fff; border: none; padding: 0.8rem 1.5rem; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: 0.6; }
  #preview { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin: 0 auto 1rem; display: none; }
  .error { color: #b00020; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="card" id="card">Loading...</div>
<script src="/js/config.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
const card = document.getElementById('card');

async function init() {
  if (!token) { card.innerHTML = '<p class="error">Missing upload token.</p>'; return; }
  try {
    const res = await fetch(`${API_BASE}/public/photo-upload/${token}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'This link is invalid.');
    render(data.member_name);
  } catch (err) {
    card.innerHTML = `<div class="icon"><i class="fas fa-clock"></i></div><h1>Link Expired</h1><p>${err.message}</p>`;
  }
}

function render(memberName) {
  card.innerHTML = `
    <div class="icon"><i class="fas fa-camera"></i></div>
    <h1>Upload Photo for ${memberName}</h1>
    <p>Take or choose a photo. It will be saved to your gym profile.</p>
    <img id="preview">
    <input type="file" id="fileInput" accept="image/*" capture="user">
    <button class="btn" id="pickBtn"><i class="fas fa-camera"></i> Choose Photo</button>
  `;
  const fileInput = document.getElementById('fileInput');
  document.getElementById('pickBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    const btn = document.getElementById('pickBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch(`${API_BASE}/public/photo-upload/${token}`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed.');
      card.innerHTML = '<div class="icon"><i class="fas fa-check"></i></div><h1>Photo Uploaded!</h1><p>You can close this page now.</p>';
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-camera"></i> Choose Photo';
      card.insertAdjacentHTML('beforeend', `<p class="error">${err.message}</p>`);
    }
  });
}

init();
</script>
</body>
</html>
