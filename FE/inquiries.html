<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquiries & Leads — wger</title>
<link rel="stylesheet" href="/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('inquiries', 'Inquiries & Leads');
const STATUS_LABELS = { new: 'New', contacted: 'Contacted', converted: 'Converted', not_interested: 'Not Interested' };

function statusBadge(status) {
  if (status === 'new') return '<span class="badge-active" style="background:rgba(59,130,246,0.1);color:#1d4ed8;"><i class="fas fa-circle" style="font-size:0.45rem;margin-right:4px;"></i>New</span>';
  if (status === 'contacted') return '<span class="badge-expiring"><i class="fas fa-phone" style="margin-right:4px;"></i>Contacted</span>';
  if (status === 'converted') return '<span class="badge-active"><i class="fas fa-check" style="margin-right:4px;"></i>Converted</span>';
  return '<span class="badge-inactive"><i class="fas fa-times" style="margin-right:4px;"></i>Not Interested</span>';
}

function render(inquiries) {
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = inquiries.filter((i) => i.date_created === today).length;
  const convertedCount = inquiries.filter((i) => i.status === 'converted').length;

  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div><div style="font-size:1.3rem;font-weight:800;color:#0f172a;">Inquiries & Leads</div><div style="color:#64748b;font-size:0.82rem;">Track walk-ins and potential members</div></div>
      <button class="btn-primary-sm" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Inquiry</button>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-xl-4"><div class="stat-card" style="padding:1rem;"><div class="stat-icon red" style="width:40px;height:40px;font-size:1rem;"><i class="fas fa-calendar-day"></i></div><div><div class="stat-value" style="font-size:1.3rem;">${todayCount}</div><div class="stat-label">Today's Inquiries</div></div></div></div>
      <div class="col-12 col-sm-6 col-xl-4"><div class="stat-card" style="padding:1rem;"><div class="stat-icon blue" style="width:40px;height:40px;font-size:1rem;"><i class="fas fa-user-clock"></i></div><div><div class="stat-value" style="font-size:1.3rem;">${inquiries.length}</div><div class="stat-label">Total Inquiries</div></div></div></div>
      <div class="col-12 col-sm-6 col-xl-4"><div class="stat-card" style="padding:1rem;"><div class="stat-icon green" style="width:40px;height:40px;font-size:1rem;"><i class="fas fa-user-check"></i></div><div><div class="stat-value" style="font-size:1.3rem;">${convertedCount}</div><div class="stat-label">Converted</div></div></div></div>
    </div>
    <p class="error" id="error" style="display:none;"></p>
    <div class="card">
      ${inquiries.length ? `<div style="overflow-x:auto;"><table class="table-clean">
        <thead><tr><th>Name</th><th>Phone</th><th>Visit Date</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody>${inquiries.map((inq) => `
          <tr>
            <td style="font-weight:600;font-size:0.875rem;color:#0f172a;">${escapeHtml(inq.name)}</td>
            <td style="font-size:0.82rem;color:#475569;">${escapeHtml(inq.phone) || '—'}</td>
            <td style="font-size:0.82rem;color:#64748b;">${inq.date_created}</td>
            <td>${statusBadge(inq.status)}</td>
            <td style="font-size:0.78rem;color:#64748b;max-width:160px;" title="${escapeHtml(inq.note)}">${escapeHtml(inq.note) || '—'}</td>
            <td><div style="display:flex;gap:0.4rem;align-items:center;position:relative;">
              <button class="btn-outline-sm" style="padding:0.3rem 0.6rem;font-size:0.75rem;" onclick="toggleStatusMenu(${inq.id})"><i class="fas fa-exchange-alt"></i></button>
              <div id="menu-${inq.id}" style="display:none;position:absolute;right:0;top:110%;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:20;min-width:140px;overflow:hidden;">
                ${Object.entries(STATUS_LABELS).filter(([val]) => val !== inq.status).map(([val, label]) => `<button style="width:100%;background:none;border:none;padding:0.5rem 0.85rem;font-size:0.78rem;color:#374151;text-align:left;cursor:pointer;" onclick="setStatus(${inq.id}, '${val}')">${label}</button>`).join('')}
              </div>
              <button class="btn-outline-sm" style="padding:0.3rem 0.6rem;font-size:0.75rem;color:#ef4444;border-color:#ef4444;" onclick="openDeleteModal(${inq.id}, '${escapeHtml(inq.name)}')"><i class="fas fa-trash-alt"></i></button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table></div>` : `<div class="empty-state"><i class="fas fa-user-clock"></i><p>No inquiries found.</p><button class="btn-primary-sm" style="margin-top:1rem;" onclick="openAddModal()"><i class="fas fa-plus"></i> Add First Inquiry</button></div>`}
    </div>
  `;
}

function load() {
  api.get('/inquiries').then(render).catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
}

function toggleStatusMenu(id) {
  document.querySelectorAll('[id^="menu-"]').forEach((el) => { if (el.id !== `menu-${id}`) el.style.display = 'none'; });
  const menu = document.getElementById(`menu-${id}`);
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('[id^="menu-"]') && !e.target.closest('.btn-outline-sm')) {
    document.querySelectorAll('[id^="menu-"]').forEach((el) => el.style.display = 'none');
  }
});

async function setStatus(id, status) {
  await api.post(`/inquiries/${id}/status`, { status });
  load();
}

function openAddModal() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="addModal">
      <div class="modal-box">
        <h3><i class="fas fa-user-plus" style="color:#dc2626;margin-right:8px;"></i>Add New Inquiry</h3>
        <form id="addForm">
          <div style="margin-bottom:0.75rem;"><label class="form-label">Full Name *</label><input id="iName" required></div>
          <div style="margin-bottom:0.75rem;"><label class="form-label">Phone Number</label><input id="iPhone" type="tel"></div>
          <div style="margin-bottom:0.75rem;"><label class="form-label">Notes</label><textarea id="iNote" rows="2"></textarea></div>
          <p class="error" id="addError" style="display:none;"></p>
          <div class="modal-actions">
            <button type="button" class="btn-outline-sm" onclick="document.getElementById('addModal').remove()">Cancel</button>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-plus"></i> Add Inquiry</button>
          </div>
        </form>
      </div>
    </div>
  `);
  document.getElementById('addModal').addEventListener('click', (e) => { if (e.target.id === 'addModal') e.target.remove(); });
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('addError');
    try {
      await api.post('/inquiries', { name: document.getElementById('iName').value, phone: document.getElementById('iPhone').value, note: document.getElementById('iNote').value });
      document.getElementById('addModal').remove();
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

function openDeleteModal(id, name) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="deleteModal">
      <div class="modal-box">
        <h3>Delete Inquiry?</h3>
        <p>Delete inquiry for ${name}? This cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn-outline-sm" onclick="document.getElementById('deleteModal').remove()">Cancel</button>
          <button style="background:#ef4444;color:#fff;border:none;padding:0.45rem 1rem;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer;" onclick="confirmDeleteInquiry(${id})"><i class="fas fa-trash-alt" style="margin-right:6px;"></i>Delete</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('deleteModal').addEventListener('click', (e) => { if (e.target.id === 'deleteModal') e.target.remove(); });
}

async function confirmDeleteInquiry(id) {
  await api.del(`/inquiries/${id}`);
  document.getElementById('deleteModal').remove();
  load();
}

load();
</script>
</body>
</html>
