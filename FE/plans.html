<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Plans — wger</title>
<link rel="stylesheet" href="/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('plans', 'Membership Plans');
const COLORS = ['#dc2626', '#10b981', '#f59e0b', '#3b82f6'];

function planCard(plan, i) {
  const color = COLORS[i % COLORS.length];
  const months = Math.max(1, Math.round(plan.duration_days / 30));
  return `
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="card" style="border-top:3px solid ${color};">
        <div class="card-body-pad">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem;">
            <div><div style="font-weight:800;font-size:1rem;color:#0f172a;">${escapeHtml(plan.name)}</div><div style="font-size:0.75rem;color:#64748b;margin-top:2px;">${plan.duration_days} days</div></div>
            ${plan.is_active ? '<span class="badge-active">Active</span>' : '<span class="badge-inactive">Inactive</span>'}
          </div>
          <div style="font-size:2rem;font-weight:900;color:${color};margin-bottom:0.5rem;">₹${plan.price}<span style="font-size:0.9rem;font-weight:400;color:#94a3b8;">/${months}mo</span></div>
          <div style="display:flex;gap:0.5rem;padding-top:0.75rem;border-top:1px solid #f1f5f9;">
            <button class="btn-outline-sm" style="flex:1;justify-content:center;" onclick="togglePlan(${plan.id})">${plan.is_active ? '<i class="fas fa-pause"></i> Deactivate' : '<i class="fas fa-play"></i> Activate'}</button>
            <button class="btn-danger-sm" onclick="openDeleteModal(${plan.id}, '${escapeHtml(plan.name)}')"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>
    </div>`;
}

function render(plans) {
  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div><div style="font-size:1.3rem;font-weight:800;color:#0f172a;">Membership Plans</div><div style="color:#64748b;font-size:0.82rem;">Define plans for your gym members</div></div>
      <button class="btn-primary-sm" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Plan</button>
    </div>
    <p class="error" id="error" style="display:none;"></p>
    ${plans.length
      ? `<div class="row g-3">${plans.map(planCard).join('')}</div>`
      : `<div class="card"><div class="empty-state" style="padding:4rem;"><i class="fas fa-tags"></i><p>No membership plans yet. Create one to get started.</p><button class="btn-primary-sm" style="margin-top:1rem;" onclick="openAddModal()"><i class="fas fa-plus"></i> Add First Plan</button></div></div>`}
  `;
}

function load() {
  api.get('/plans').then(render).catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
}

async function togglePlan(id) {
  await api.post(`/plans/${id}/toggle`);
  load();
}

function openAddModal() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="addModal">
      <div class="modal-box">
        <h3><i class="fas fa-plus" style="color:#dc2626;margin-right:8px;"></i>New Membership Plan</h3>
        <form id="addForm">
          <div style="margin-bottom:0.75rem;"><label class="form-label">Plan Name *</label><input id="pName" placeholder="e.g. Gold Monthly" required></div>
          <div style="margin-bottom:0.75rem;"><label class="form-label">Duration (days) *</label><input id="pDuration" type="number" min="1" value="30" required></div>
          <div style="margin-bottom:0.75rem;"><label class="form-label">Price (₹) *</label><input id="pPrice" type="number" min="0" step="0.01" placeholder="e.g. 1200" required></div>
          <p class="error" id="addError" style="display:none;"></p>
          <div class="modal-actions">
            <button type="button" class="btn-outline-sm" onclick="document.getElementById('addModal').remove()">Cancel</button>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-save"></i> Create Plan</button>
          </div>
        </form>
      </div>
    </div>
  `);
  document.getElementById('addModal').addEventListener('click', (e) => { if (e.target.id === 'addModal') e.target.remove(); });
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('addError');
    try {
      await api.post('/plans', { name: document.getElementById('pName').value, duration_days: Number(document.getElementById('pDuration').value), price: document.getElementById('pPrice').value });
      document.getElementById('addModal').remove();
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

function openDeleteModal(id, name) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="deleteModal">
      <div class="modal-box">
        <h3>Delete Plan?</h3>
        <p>Delete '${name}'? This cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn-outline-sm" onclick="document.getElementById('deleteModal').remove()">Cancel</button>
          <button style="background:#ef4444;color:#fff;border:none;padding:0.45rem 1rem;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer;" onclick="confirmDeletePlan(${id})"><i class="fas fa-trash-alt" style="margin-right:6px;"></i>Delete</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('deleteModal').addEventListener('click', (e) => { if (e.target.id === 'deleteModal') e.target.remove(); });
}

async function confirmDeletePlan(id) {
  await api.del(`/plans/${id}`);
  document.getElementById('deleteModal').remove();
  load();
}

load();
</script>
</body>
</html>
