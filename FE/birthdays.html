<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthdays Today — wger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('dashboard', 'Birthdays Today');

function render(members) {
  const todayDisplay = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('pageBody').innerHTML = `
    <div style="margin-bottom:1.5rem;">
      <a href="/index.html" style="font-size:0.82rem;color:#64748b;text-decoration:none;"><i class="fas fa-arrow-left" style="margin-right:4px;"></i>Back to dashboard</a>
    </div>
    <div class="card">
      <div class="card-header-plain">
        <h6><i class="fas fa-birthday-cake" style="color:#ec4899;margin-right:8px;"></i>Birthdays Today — ${todayDisplay}</h6>
        <span style="font-size:0.75rem;color:#64748b;">${members.length} member${members.length === 1 ? '' : 's'}</span>
      </div>
      ${members.length ? `
      <table class="table-clean">
        <thead><tr><th>Member</th><th>Date of Birth</th><th></th></tr></thead>
        <tbody>
          ${members.map((m) => `
            <tr>
              <td><div style="display:flex;align-items:center;gap:10px;">
                <div class="member-avatar" style="background:#fdf2f8;color:#ec4899;">${m.username.slice(0,2).toUpperCase()}</div>
                <div>
                  <div style="font-weight:700;font-size:0.9rem;color:#0f172a;">${escapeHtml((m.first_name + ' ' + m.last_name).trim() || m.username)} <i class="fas fa-birthday-cake" style="color:#ec4899;font-size:0.75rem;margin-left:4px;"></i></div>
                  <div style="color:#94a3b8;font-size:0.75rem;">@${escapeHtml(m.username)}</div>
                </div>
              </div></td>
              <td style="color:#64748b;font-size:0.85rem;">${m.birthdate}</td>
              <td><a href="/member.html?id=${m.id}" class="btn-outline-sm" style="padding:0.25rem 0.6rem;font-size:0.75rem;">View</a></td>
            </tr>`).join('')}
        </tbody>
      </table>` : `
      <div class="empty-state" style="padding:3.5rem 1rem;">
        <i class="fas fa-birthday-cake" style="font-size:2.5rem;opacity:0.3;display:block;margin-bottom:1rem;"></i>
        <p style="font-size:0.9rem;color:#64748b;">No birthdays today.</p>
      </div>`}
    </div>
  `;
}

api.get('/members/birthdays').then(render).catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
</script>
</body>
</html>
