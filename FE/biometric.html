<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biometric Machine Setup — wger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('biometric', 'Biometric Machine Setup');

function deviceRow(device) {
  return `
    <tr>
        <td>
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:36px;height:36px;background:${device.is_active ? 'rgba(220,38,38,0.1)' : 'rgba(100,116,139,0.1)'};border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fas fa-fingerprint" style="color:${device.is_active ? '#dc2626' : '#94a3b8'};font-size:0.9rem;"></i>
                </div>
                <div>
                    <div style="font-weight:700;font-size:0.875rem;color:#0f172a;">${escapeHtml(device.name)}</div>
                    ${device.notes ? `<div style="font-size:0.72rem;color:#94a3b8;">${escapeHtml(device.notes).slice(0, 40)}</div>` : ''}
                </div>
            </div>
        </td>
        <td>
            <code style="background:#f1f5f9;padding:3px 8px;border-radius:6px;font-size:0.82rem;color:#334155;">${escapeHtml(device.corporate_id)} / ${escapeHtml(device.api_username)}</code>
        </td>
        <td>
            ${device.is_active
              ? '<span class="badge-active"><i class="fas fa-circle" style="font-size:0.45rem;margin-right:4px;"></i>Active</span>'
              : '<span class="badge-inactive"><i class="fas fa-circle" style="font-size:0.45rem;margin-right:4px;"></i>Inactive</span>'}
        </td>
        <td>
            <div>
                <div style="font-size:0.8rem;color:#334155;" id="sync-display-${device.id}">${device.last_sync_display}</div>
                ${device.last_sync_count !== null && device.last_sync_count !== undefined ? `<div style="font-size:0.7rem;color:#94a3b8;">${device.last_sync_count} records</div>` : ''}
            </div>
        </td>
        <td>
            <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
                <button type="button" class="btn-primary-sm" style="padding:0.3rem 0.7rem;font-size:0.75rem;" id="sync-btn-${device.id}"
                        onclick="startSync(${device.id})"
                        ${!device.is_active ? 'disabled title="Device inactive"' : ''}>
                    <i class="fas fa-sync-alt" id="sync-icon-${device.id}"></i> <span id="sync-label-${device.id}">Sync</span>
                </button>
                <button type="button" class="btn-outline-sm" style="padding:0.3rem 0.7rem;font-size:0.75rem;" title="Edit"
                        onclick='openEditModal(${JSON.stringify(device)})'>
                    <i class="fas fa-pen"></i>
                </button>
                <button type="button" class="btn-outline-sm" style="padding:0.3rem 0.7rem;font-size:0.75rem;"
                        title="${device.is_active ? 'Deactivate' : 'Activate'}" onclick="toggleDevice(${device.id})">
                    <i class="fas ${device.is_active ? 'fa-pause' : 'fa-play'}"></i>
                </button>
                <button type="button" class="btn-danger-sm" style="padding:0.3rem 0.7rem;font-size:0.75rem;"
                        onclick="openDeleteModal(${device.id}, '${escapeHtml(device.name)}')">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </td>
    </tr>`;
}

function render(devices) {
  document.getElementById('pageBody').innerHTML = `
    <div style="background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:1.5rem 1.75rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;">
        <div style="width:56px;height:56px;background:rgba(220,38,38,0.2);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="fas fa-fingerprint" style="font-size:1.5rem;color:#fca5a5;"></i>
        </div>
        <div style="flex:1;">
            <div style="color:white;font-weight:700;font-size:1rem;margin-bottom:4px;">e-TimeOffice / Biometric Machine Integration</div>
            <div style="color:#94a3b8;font-size:0.82rem;line-height:1.6;">
                Add your e-TimeOffice cloud API credentials (Corporate ID, Username, Password) — no local network needed.
                After setup, click <strong style="color:#c7d2fe;">Sync</strong> to pull attendance automatically.
                Members enrolled on the machine that don't exist yet in wger are <strong style="color:#c7d2fe;">created automatically</strong>
                the first time their punch is synced.
            </div>
        </div>
        <button type="button" class="btn-primary-sm" onclick="openAddModal()" style="flex-shrink:0;">
            <i class="fas fa-plus"></i> Add Machine
        </button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-lg-4">
            <div style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem;text-align:center;">
                <div style="width:44px;height:44px;background:rgba(220,38,38,0.1);border-radius:12px;margin:0 auto 0.75rem;display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-key" style="color:#dc2626;"></i>
                </div>
                <div style="font-weight:700;font-size:0.875rem;color:#0f172a;margin-bottom:4px;">Step 1 — Get Credentials</div>
                <div style="font-size:0.78rem;color:#64748b;line-height:1.5;">Get your Corporate ID, Username and Password from your e-TimeOffice account.</div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem;text-align:center;">
                <div style="width:44px;height:44px;background:rgba(16,185,129,0.1);border-radius:12px;margin:0 auto 0.75rem;display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-cog" style="color:#10b981;"></i>
                </div>
                <div style="font-weight:700;font-size:0.875rem;color:#0f172a;margin-bottom:4px;">Step 2 — Configure</div>
                <div style="font-size:0.78rem;color:#64748b;line-height:1.5;">Add the machine here with those credentials. No local network access needed.</div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem;text-align:center;">
                <div style="width:44px;height:44px;background:rgba(245,158,11,0.1);border-radius:12px;margin:0 auto 0.75rem;display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-sync-alt" style="color:#f59e0b;"></i>
                </div>
                <div style="font-weight:700;font-size:0.875rem;color:#0f172a;margin-bottom:4px;">Step 3 — Sync</div>
                <div style="font-size:0.78rem;color:#64748b;line-height:1.5;">Click Sync to pull all punch records. Records auto-match to members by their user ID.</div>
            </div>
        </div>
    </div>

    ${devices.length ? `
    <div class="card mb-4" style="margin-bottom:1.5rem;">
        <div class="card-header-plain">
            <h6><i class="fas fa-server" style="color:#dc2626;margin-right:8px;"></i>Configured Machines</h6>
            <span style="font-size:0.75rem;color:#64748b;">${devices.length} device${devices.length === 1 ? '' : 's'}</span>
        </div>
        <div style="overflow-x:auto;">
            <table class="table-clean">
                <thead><tr><th>Device Name</th><th>Connection</th><th>Status</th><th>Last Sync</th><th>Actions</th></tr></thead>
                <tbody>${devices.map(deviceRow).join('')}</tbody>
            </table>
        </div>
    </div>` : `
    <div class="card mb-4" style="margin-bottom:1.5rem;">
        <div class="empty-state" style="padding:3.5rem 1rem;">
            <i class="fas fa-server" style="font-size:2.5rem;opacity:0.3;display:block;margin-bottom:1rem;"></i>
            <p style="font-size:0.9rem;color:#64748b;">No biometric machines configured yet.</p>
            <button type="button" class="btn-primary-sm" onclick="openAddModal()" style="margin-top:1rem;">
                <i class="fas fa-plus"></i> Add Your First Machine
            </button>
        </div>
    </div>`}

    <div class="card">
        <div class="card-header-plain">
            <h6><i class="fas fa-question-circle" style="color:#f59e0b;margin-right:8px;"></i>Troubleshooting Guide</h6>
            <button class="btn-outline-sm" style="font-size:0.75rem;padding:0.3rem 0.7rem;" onclick="document.getElementById('troubleshoot').style.display = document.getElementById('troubleshoot').style.display === 'none' ? 'block' : 'none'">
                <i class="fas fa-chevron-down"></i> Toggle
            </button>
        </div>
        <div id="troubleshoot" class="card-body-pad" style="display:none;">
            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <div style="background:#fef9f0;border:1px solid #fde68a;border-radius:10px;padding:1rem;">
                        <div style="font-weight:700;font-size:0.85rem;color:#92400e;margin-bottom:0.6rem;"><i class="fas fa-exclamation-triangle" style="margin-right:4px;"></i> Connection Failed</div>
                        <ul style="font-size:0.8rem;color:#78350f;line-height:1.8;padding-left:1rem;">
                            <li>Double-check Corporate ID, Username and Password</li>
                            <li>Make sure your e-TimeOffice account is active</li>
                            <li>The vendor's servers occasionally return a temporary error — sync automatically retries a few times before giving up</li>
                        </ul>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:1rem;">
                        <div style="font-weight:700;font-size:0.85rem;color:#14532d;margin-bottom:0.6rem;"><i class="fas fa-info-circle" style="margin-right:4px;"></i> Member Matching</div>
                        <ul style="font-size:0.8rem;color:#166534;line-height:1.8;padding-left:1rem;">
                            <li>Members are matched by their Employee Code (Empcode) on the machine</li>
                            <li>If no matching wger member exists yet, one is <strong>created automatically</strong> using the machine's Name and Empcode</li>
                        </ul>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div style="background:#fdf4ff;border:1px solid #e9d5ff;border-radius:10px;padding:1rem;">
                        <div style="font-weight:700;font-size:0.85rem;color:#581c87;margin-bottom:0.6rem;"><i class="fas fa-sync-alt" style="margin-right:4px;"></i> Sync Frequency</div>
                        <ul style="font-size:0.8rem;color:#6b21a8;line-height:1.8;padding-left:1rem;">
                            <li>Sync manually whenever needed</li>
                            <li>Duplicate records are automatically skipped</li>
                            <li>Syncing does not delete data from the machine</li>
                            <li>Best practice: sync once every morning</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addDeviceModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="deviceForm">
            <input type="hidden" id="id_form_action" value="add">
            <input type="hidden" id="id_device_id" value="">
            <div class="modal-header">
                <h5 class="modal-title" style="font-weight:700;" id="deviceModalTitle"><i class="fas fa-plus" style="color:#dc2626;margin-right:8px;"></i>Add Biometric Machine</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div style="flex:1 1 100%;"><label class="form-label">Machine Name *</label><input type="text" id="id_name" required autocomplete="off"><div style="font-size:0.72rem;color:#94a3b8;margin-top:4px;">A friendly name to identify this device</div></div>
                    <div><label class="form-label">Corporate ID *</label><input type="text" id="id_corporate_id" autocomplete="off"></div>
                    <div><label class="form-label">Username *</label><input type="text" id="id_api_username" autocomplete="off"></div>
                    <div><label class="form-label">Password <span id="id_password_required">*</span></label><input type="password" id="id_api_password" autocomplete="new-password"><div style="font-size:0.72rem;margin-top:4px;color:#f59e0b;font-weight:600;" id="id_password_hint"></div></div>
                </div>
                <div style="font-size:0.72rem;color:#94a3b8;margin-top:0.75rem;">These are the credentials for your e-TimeOffice account (provided by your machine vendor). No IP address or local network access is needed.</div>
                <div style="margin-top:0.75rem;"><label class="form-label">Notes <small style="text-transform:none;font-weight:400;color:#94a3b8;">(optional)</small></label><textarea id="id_notes" rows="2" placeholder="e.g. Ground floor, near reception desk"></textarea></div>
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:1rem;margin-top:1rem;">
                    <div style="font-size:0.8rem;color:#475569;display:flex;gap:8px;align-items:flex-start;">
                        <i class="fas fa-lightbulb" style="color:#f59e0b;margin-top:2px;flex-shrink:0;"></i>
                        <div><strong>Important:</strong> When syncing via e-TimeOffice, any employee code (Empcode) found on the machine that doesn't have a matching wger member yet will be <strong>created automatically</strong>, using their machine Name and Empcode.</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-outline-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn-primary-sm" id="deviceModalSubmit"><i class="fas fa-save" style="margin-right:4px;"></i> Save Machine</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;

  document.getElementById('deviceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('deviceModalSubmit');
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    const originalHtml = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:4px;"></i> Saving...';
    const action = document.getElementById('id_form_action').value;
    const deviceId = document.getElementById('id_device_id').value;
    const payload = {
      name: document.getElementById('id_name').value,
      corporate_id: document.getElementById('id_corporate_id').value,
      api_username: document.getElementById('id_api_username').value,
      notes: document.getElementById('id_notes').value,
    };
    try {
      if (action === 'edit') {
        payload.api_password = document.getElementById('id_api_password').value || null;
        await api.put(`/devices/${deviceId}`, payload);
      } else {
        payload.api_password = document.getElementById('id_api_password').value;
        await api.post('/devices', payload);
      }
      bootstrap.Modal.getInstance(document.getElementById('addDeviceModal')).hide();
      load();
    } catch (err) {
      alert(err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalHtml;
    }
  });
}

function resetDeviceForm() {
  document.getElementById('deviceForm').reset();
  document.getElementById('id_device_id').value = '';
}

function openAddModal() {
  resetDeviceForm();
  document.getElementById('id_form_action').value = 'add';
  document.getElementById('deviceModalTitle').innerHTML = '<i class="fas fa-plus" style="color:#dc2626;margin-right:8px;"></i>Add Biometric Machine';
  document.getElementById('deviceModalSubmit').innerHTML = '<i class="fas fa-save" style="margin-right:4px;"></i> Save Machine';
  document.getElementById('id_password_required').style.display = '';
  document.getElementById('id_password_hint').textContent = '';
  document.getElementById('id_api_password').placeholder = '';
  document.getElementById('id_api_password').required = true;
  new bootstrap.Modal(document.getElementById('addDeviceModal')).show();
}

function openEditModal(device) {
  resetDeviceForm();
  document.getElementById('id_form_action').value = 'edit';
  document.getElementById('id_device_id').value = device.id;
  document.getElementById('deviceModalTitle').innerHTML = '<i class="fas fa-pen" style="color:#dc2626;margin-right:8px;"></i>Edit Biometric Machine';
  document.getElementById('deviceModalSubmit').innerHTML = '<i class="fas fa-save" style="margin-right:4px;"></i> Save Changes';
  document.getElementById('id_name').value = device.name || '';
  document.getElementById('id_corporate_id').value = device.corporate_id || '';
  document.getElementById('id_api_username').value = device.api_username || '';
  document.getElementById('id_notes').value = device.notes || '';
  document.getElementById('id_password_required').style.display = 'none';
  document.getElementById('id_api_password').required = false;
  document.getElementById('id_api_password').placeholder = '•••••••• (already saved)';
  document.getElementById('id_password_hint').innerHTML = '<i class="fas fa-lock" style="margin-right:4px;"></i>A password is already saved for this device. Leave this field blank to keep it — only type here if you want to change it.';
  new bootstrap.Modal(document.getElementById('addDeviceModal')).show();
}

async function toggleDevice(id) {
  await api.post(`/devices/${id}/toggle`);
  load();
}

function openDeleteModal(id, name) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="deleteModal">
      <div class="modal-box">
        <h3>Remove Machine?</h3>
        <p>Remove '${name}'? This cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn-outline-sm" onclick="document.getElementById('deleteModal').remove()">Cancel</button>
          <button style="background:#ef4444;color:#fff;border:none;padding:0.45rem 1rem;border-radius:8px;font-weight:700;cursor:pointer;" onclick="confirmDeleteDevice(${id})">Remove</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('deleteModal').addEventListener('click', (e) => { if (e.target.id === 'deleteModal') e.target.remove(); });
}
async function confirmDeleteDevice(id) {
  await api.del(`/devices/${id}`);
  document.getElementById('deleteModal').remove();
  load();
}

function startSync(deviceId) {
  const btn = document.getElementById(`sync-btn-${deviceId}`);
  const icon = document.getElementById(`sync-icon-${deviceId}`);
  const label = document.getElementById(`sync-label-${deviceId}`);
  btn.disabled = true;
  icon.classList.add('fa-spin');
  label.textContent = 'Syncing...';
  api.post(`/devices/${deviceId}/sync`).then(load).catch((err) => { alert(err.message); load(); });
}

function load() {
  api.get('/devices').then(render).catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
}

load();
</script>
</body>
</html>
