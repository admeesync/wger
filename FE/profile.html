<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — wger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('dashboard', 'My Profile');

function render(p) {
  const gym = p.gym;
  document.getElementById('pageBody').innerHTML = `
    <form id="profileForm">
      <div class="row g-3">
        <div class="col-12 col-xl-4">
          <div class="card" style="margin-bottom:1rem;">
            <div style="background:linear-gradient(135deg,#0f172a,#1e293b);height:90px;border-radius:14px 14px 0 0;position:relative;">
              <div style="position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);">
                <div style="width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#991b1b);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;color:white;border:4px solid white;box-shadow:0 4px 20px rgba(220,38,38,0.4);">
                  ${p.username.slice(0,2).toUpperCase()}
                </div>
              </div>
            </div>
            <div style="padding:3.5rem 1.5rem 1.5rem;text-align:center;">
              <div style="font-size:1.2rem;font-weight:800;color:#0f172a;">${escapeHtml((p.first_name + ' ' + p.last_name).trim() || p.username)}</div>
              <div style="color:#94a3b8;font-size:0.8rem;margin-bottom:0.75rem;">@${escapeHtml(p.username)}</div>
              <span style="background:rgba(220,38,38,0.1);color:#dc2626;padding:4px 14px;border-radius:20px;font-size:0.75rem;font-weight:700;">${p.role === 'super_admin' ? 'Super Admin' : 'Gym Admin'}</span>
              <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid #f1f5f9;display:flex;justify-content:space-around;">
                <div style="text-align:center;"><div style="font-size:1.1rem;font-weight:800;color:#0f172a;">${p.date_joined}</div><div style="font-size:0.7rem;color:#94a3b8;margin-top:2px;">Member Since</div></div>
                <div style="text-align:center;"><div style="font-size:1.1rem;font-weight:800;color:#10b981;">Active</div><div style="font-size:0.7rem;color:#94a3b8;margin-top:2px;">Status</div></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header-plain"><h6><i class="fas fa-user" style="color:#dc2626;margin-right:8px;"></i>Personal Information</h6></div>
            <div class="card-body-pad">
              <div style="display:flex;flex-direction:column;gap:1rem;">
                <div style="display:flex;gap:0.5rem;">
                  <div style="flex:1;"><label class="form-label">First Name</label><input type="text" id="first_name" value="${escapeHtml(p.first_name)}" placeholder="First name"></div>
                  <div style="flex:1;"><label class="form-label">Last Name</label><input type="text" id="last_name" value="${escapeHtml(p.last_name)}" placeholder="Last name"></div>
                </div>
                <div><label class="form-label">Username</label><input type="text" value="${escapeHtml(p.username)}" disabled style="background:#f8fafc;color:#94a3b8;"><div style="font-size:0.72rem;color:#94a3b8;margin-top:3px;">Username cannot be changed</div></div>
                <div><label class="form-label">Email</label><input type="email" id="email" value="${escapeHtml(p.email)}" placeholder="Email address"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-8">
          <div class="card">
            <div class="card-header-plain"><h6><i class="fas fa-dumbbell" style="color:#10b981;margin-right:8px;"></i>Company / Gym Information</h6></div>
            <div class="card-body-pad">
              ${gym ? `
              <div style="display:flex;flex-direction:column;gap:1rem;">
                <div><label class="form-label">Gym Name</label><input type="text" id="gym_name" value="${escapeHtml(gym.name)}" placeholder="Gym name"></div>
                <div style="display:flex;gap:0.5rem;">
                  <div style="flex:1;"><label class="form-label">Phone</label><input type="text" id="gym_phone" value="${escapeHtml(gym.phone)}" placeholder="Phone number"></div>
                  <div style="flex:1;"><label class="form-label">Email</label><input type="email" id="gym_email" value="${escapeHtml(gym.email)}" placeholder="Gym email"></div>
                </div>
                <div><label class="form-label">Owner / Manager Name</label><input type="text" id="gym_owner" value="${escapeHtml(gym.owner)}" placeholder="Owner name"></div>
                <div style="display:flex;gap:0.5rem;">
                  <div style="flex:2;"><label class="form-label">Street</label><input type="text" id="gym_street" value="${escapeHtml(gym.street)}" placeholder="Street address"></div>
                  <div style="flex:1;"><label class="form-label">City</label><input type="text" id="gym_city" value="${escapeHtml(gym.city)}" placeholder="City"></div>
                  <div style="flex:1;"><label class="form-label">ZIP Code</label><input type="text" id="gym_zip" value="${escapeHtml(gym.zip_code)}" placeholder="ZIP"></div>
                </div>

                <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:1.25rem;margin-top:0.75rem;">
                  <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#166534;margin-bottom:0.75rem;"><i class="fab fa-google-drive" style="margin-right:4px;"></i> Google Drive — Member Photos</div>
                  <label class="form-label" style="font-size:0.82rem;color:#166534;">Drive Folder Link or ID</label>
                  <input type="text" id="drive_folder_id" value="${escapeHtml(gym.drive_folder_id)}" placeholder="https://drive.google.com/drive/folders/... or just the folder ID">
                  <div style="font-size:0.75rem;color:#166534;margin-top:0.5rem;line-height:1.7;">
                    <strong>Note:</strong> Google Drive sync isn't wired up in this build — this field is stored but not yet used to upload photos. Photo upload works directly from the member's profile page instead.
                  </div>
                </div>

                <div style="background:#f8fafc;border-radius:12px;padding:1.25rem;margin-top:0.25rem;">
                  <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;margin-bottom:1rem;">Gym Overview</div>
                  <div class="row g-3">
                    <div class="col-4"><div style="text-align:center;background:white;border-radius:10px;padding:0.85rem;border:1px solid #e2e8f0;"><div style="font-size:1.4rem;font-weight:800;color:#dc2626;">${p.total_members}</div><div style="font-size:0.7rem;color:#64748b;margin-top:2px;">Members</div></div></div>
                    <div class="col-4"><div style="text-align:center;background:white;border-radius:10px;padding:0.85rem;border:1px solid #e2e8f0;"><div style="font-size:1.4rem;font-weight:800;color:#10b981;">${p.active_contracts}</div><div style="font-size:0.7rem;color:#64748b;margin-top:2px;">Active Plans</div></div></div>
                    <div class="col-4"><div style="text-align:center;background:white;border-radius:10px;padding:0.85rem;border:1px solid #e2e8f0;"><div style="font-size:1.4rem;font-weight:800;color:#f59e0b;">${p.today_checkins}</div><div style="font-size:0.7rem;color:#64748b;margin-top:2px;">Today's Visits</div></div></div>
                  </div>
                </div>
              </div>` : `<div style="text-align:center;padding:2rem;color:#94a3b8;font-size:0.85rem;"><i class="fas fa-building" style="font-size:2rem;opacity:0.3;display:block;margin-bottom:0.75rem;"></i>No gym assigned to your account.</div>`}
            </div>
          </div>
        </div>
      </div>

      <p class="error" id="error" style="display:none;margin-top:1rem;"></p>
      <div style="display:flex;justify-content:flex-end;margin-top:1.25rem;">
        <button type="submit" class="btn-primary-sm" style="padding:0.65rem 1.75rem;font-size:0.9rem;"><i class="fas fa-save" style="margin-right:8px;"></i>Save Changes</button>
      </div>
    </form>
  `;

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('error');
    const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    try {
      await api.post('/profile', {
        first_name: val('first_name'), last_name: val('last_name'), email: val('email'),
        gym_name: val('gym_name'), gym_phone: val('gym_phone'), gym_email: val('gym_email'),
        gym_owner: val('gym_owner'), gym_street: val('gym_street'), gym_city: val('gym_city'),
        gym_zip: val('gym_zip'), drive_folder_id: val('drive_folder_id'),
      });
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

function load() {
  api.get('/profile').then(render).catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
}
load();
</script>
</body>
</html>
