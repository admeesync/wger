<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Profile — wger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<style>
.avatar-lg {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 800; color: white;
    flex-shrink: 0; box-shadow: 0 4px 20px rgba(220,38,38,0.35);
    cursor: pointer; position: relative; overflow: hidden;
}
.info-row { display: flex; align-items: flex-start; gap: 10px; padding: 0.6rem 0; border-bottom: 1px solid #f8fafc; }
.info-row:last-child { border-bottom: none; }
.info-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; width: 80px; flex-shrink: 0; padding-top: 2px; }
.info-value { font-size: 0.875rem; color: #1e293b; font-weight: 500; }
.heat-cell { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 600; }
.heat-0 { background: #f1f5f9; color: #94a3b8; }
.heat-2 { background: rgba(220,38,38,0.5); color: white; }
.tab-btn { padding: 0.55rem 1.1rem; border: none; background: transparent; font-size: 0.85rem; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; }
.tab-btn.active { color: #dc2626; border-bottom-color: #dc2626; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
</style>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('members', 'Member Profile');
const memberId = new URLSearchParams(window.location.search).get('id');
if (!memberId) window.location.href = '/members.html';
const BASE_ORIGIN = API_BASE.replace('/api', '');

function infoRow(icon, label, value) {
  return `<div class="info-row"><span class="info-label"><i class="fas ${icon}" style="margin-right:4px;"></i>${label}</span><span class="info-value">${value}</span></div>`;
}

function fullName(m) {
  const n = `${m.first_name || ''} ${m.last_name || ''}`.trim();
  return n || m.username;
}

function calcAge(birthdate) {
  if (!birthdate) return null;
  const b = new Date(birthdate), t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) age--;
  return age;
}

let currentMember = null;

async function render(member, contracts, status, attendance, notes, documents) {
  currentMember = member;
  const initials = member.username.slice(0, 2).toUpperCase();
  let photoUrl = null;
  try { const s = await api.get(`/members/${memberId}/photo/status`); photoUrl = s.has_photo ? s.url : null; } catch (e) { /* ignore */ }

  const statusBadge = status === 'active'
    ? '<span class="badge-active"><i class="fas fa-circle" style="font-size:0.45rem;margin-right:4px;"></i>Active</span>'
    : status === 'expiring'
    ? '<span class="badge-expiring"><i class="fas fa-exclamation-circle" style="margin-right:4px;"></i>Expiring Soon</span>'
    : '<span class="badge-inactive"><i class="fas fa-circle" style="font-size:0.45rem;margin-right:4px;"></i>Inactive</span>';

  const today = new Date();
  const since = new Date(); since.setDate(since.getDate() - 30);
  const dateRange = [];
  for (let d = new Date(since); d <= today; d.setDate(d.getDate() + 1)) dateRange.push(new Date(d));
  const attByDate = new Set(attendance.map((a) => a.date));

  document.getElementById('pageBody').innerHTML = `
    <div style="margin-bottom:1rem;"><a href="/members.html" style="color:#64748b;text-decoration:none;font-size:0.82rem;"><i class="fas fa-arrow-left"></i> Back to Members</a></div>
    <div class="row g-3">
      <div class="col-12 col-xl-4">
        <div class="card mb-3" style="margin-bottom:1rem;">
          <div style="background:linear-gradient(135deg,#0f172a,#1e293b);height:80px;border-radius:14px 14px 0 0;position:relative;">
            <div style="position:absolute;bottom:-35px;left:1.5rem;">
              <div class="avatar-lg" id="avatarBox" onclick="${photoUrl ? `openPhotoLightbox('${photoUrl}')` : `document.getElementById('photoInput').click()`}" title="${photoUrl ? 'Click to view photo' : 'Click to upload photo'}" style="${photoUrl ? 'background:none;padding:0;' : ''}">
                ${photoUrl ? `<img src="${photoUrl}" style="width:100%;height:100%;object-fit:cover;">` : initials}
              </div>
              <input type="file" id="photoInput" accept="image/*" style="display:none;">
              ${photoUrl ? `
              <button onclick="event.stopPropagation();document.getElementById('photoInput').click();" class="btn-outline-sm" style="position:absolute;left:-4px;bottom:-4px;width:28px;height:28px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:0.7rem;" title="Change photo">
                <i class="fas fa-pen"></i>
              </button>` : ''}
              <button onclick="event.stopPropagation();openQrModal();" class="btn-outline-sm" style="position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:0.7rem;" title="Let member upload their own photo via phone">
                <i class="fas fa-qrcode"></i>
              </button>
            </div>
          </div>
          <div style="padding:3rem 1.5rem 1.25rem;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.5rem;">
              <div><div style="font-size:1.15rem;font-weight:800;color:#0f172a;">${escapeHtml(fullName(member))}</div><div style="color:#94a3b8;font-size:0.8rem;">@${escapeHtml(member.username)}</div></div>
              <div style="display:flex;gap:0.4rem;align-items:center;">${statusBadge}<button onclick="openEditModal()" class="btn-outline-sm" style="padding:0.3rem 0.6rem;font-size:0.75rem;" title="Edit Details"><i class="fas fa-pen"></i></button></div>
            </div>
            <div style="margin-top:1.25rem;">
              ${infoRow('fa-envelope', 'Email', escapeHtml(member.email))}
              ${infoRow('fa-phone', 'Phone', escapeHtml(member.phone) || '—')}
              ${infoRow('fa-venus-mars', 'Gender', member.gender === '1' ? 'Male' : member.gender === '2' ? 'Female' : '—')}
              ${infoRow('fa-birthday-cake', 'DOB', member.birthdate || '—')}
              ${infoRow('fa-calendar', 'Joined', member.date_joined)}
              ${infoRow('fa-user-tag', 'Member ID', `<span style="font-family:monospace;background:#f1f5f9;padding:2px 7px;border-radius:5px;">#${member.id}</span>`)}
              ${infoRow('fa-fingerprint', 'Device ID', `
                <form id="deviceForm" style="display:flex;gap:6px;">
                  <input id="deviceIdInput" value="${member.device_user_id || ''}" placeholder="e.g. 8" style="width:80px;padding:2px 6px;font-size:0.82rem;">
                  <button type="submit" style="background:#10b981;color:#fff;border:none;padding:2px 8px;border-radius:6px;font-size:0.75rem;cursor:pointer;">Save</button>
                </form>`)}
            </div>
          </div>
        </div>

        <div class="card mb-3" style="margin-bottom:1rem;">
          <div class="card-header-plain">
            <h6><i class="fas fa-id-card" style="color:#dc2626;margin-right:8px;"></i>Current Membership</h6>
            <button onclick="openContractModal()" class="btn-outline-sm" style="padding:0.25rem 0.6rem;font-size:0.72rem;"><i class="fas fa-plus"></i> New Contract</button>
          </div>
          <div class="card-body-pad">
            ${contracts.length ? (() => {
              const c = contracts[0];
              const expired = c.date_end && c.date_end < today.toISOString().slice(0, 10);
              return `
              <div style="background:linear-gradient(135deg,rgba(220,38,38,0.08),rgba(153,27,27,0.08));border:1px solid rgba(220,38,38,0.15);border-radius:12px;padding:1rem;">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
                  <div><div style="font-size:1.5rem;font-weight:900;color:#0f172a;">₹${c.amount}</div><div style="font-size:0.72rem;color:#94a3b8;">Amount</div></div>
                  <div style="text-align:right;"><div style="font-size:0.875rem;font-weight:700;color:${expired ? '#ef4444' : '#10b981'};">${c.date_end || 'No end date'}</div><div style="font-size:0.72rem;color:#94a3b8;">Expiry</div></div>
                </div>
                <div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid rgba(220,38,38,0.1);font-size:0.75rem;color:#64748b;">Started: ${c.date_start}</div>
              </div>`;
            })() : '<div style="text-align:center;padding:1.5rem 0;color:#94a3b8;"><i class="fas fa-file-contract" style="font-size:1.5rem;opacity:0.4;display:block;margin-bottom:0.5rem;"></i>No active membership</div>'}
            <div style="display:flex;gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap;">
              <button onclick="confirmDelete()" class="btn-outline-sm" style="color:#ef4444;border-color:#ef4444;"><i class="fas fa-trash-alt"></i> Delete Member</button>
              ${photoUrl ? `<button onclick="deletePhoto()" class="btn-outline-sm" style="color:#f59e0b;border-color:#f59e0b;"><i class="fas fa-image"></i> Remove Photo</button>` : ''}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header-plain"><h6><i class="fas fa-chart-bar" style="color:#10b981;margin-right:8px;"></i>Stats</h6></div>
          <div class="card-body-pad" style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div style="background:#f8fafc;border-radius:10px;padding:0.85rem;text-align:center;"><div style="font-size:1.4rem;font-weight:800;color:#dc2626;">${attendance.length}</div><div style="font-size:0.7rem;color:#64748b;">Visits (30d)</div></div>
            <div style="background:#f8fafc;border-radius:10px;padding:0.85rem;text-align:center;"><div style="font-size:1.4rem;font-weight:800;color:#f59e0b;">${contracts.length}</div><div style="font-size:0.7rem;color:#64748b;">Contracts</div></div>
            <div style="background:#f8fafc;border-radius:10px;padding:0.85rem;text-align:center;grid-column:span 2;"><div style="font-size:1.4rem;font-weight:800;color:#ef4444;">${calcAge(member.birthdate) ?? '—'}</div><div style="font-size:0.7rem;color:#64748b;">Age</div></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-xl-8">
        <div class="card mb-3" style="margin-bottom:1rem;">
          <div class="card-header-plain"><h6><i class="fas fa-fire" style="color:#ef4444;margin-right:8px;"></i>Attendance — Last 30 Days</h6></div>
          <div class="card-body-pad">
            <div style="display:flex;flex-wrap:wrap;gap:5px;">
              ${dateRange.map((d) => {
                const iso = d.toISOString().slice(0, 10);
                return `<div class="heat-cell ${attByDate.has(iso) ? 'heat-2' : 'heat-0'}" title="${iso}">${d.getDate()}</div>`;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="card">
          <div style="border-bottom:1px solid #f1f5f9;display:flex;padding:0 1rem;">
            <button class="tab-btn active" onclick="switchTab('attendance', this)"><i class="fas fa-clock" style="margin-right:4px;"></i>Attendance Log</button>
            <button class="tab-btn" onclick="switchTab('contracts', this)"><i class="fas fa-file-contract" style="margin-right:4px;"></i>Contract History</button>
            <button class="tab-btn" onclick="switchTab('notes', this)"><i class="fas fa-sticky-note" style="margin-right:4px;"></i>Notes</button>
            <button class="tab-btn" onclick="switchTab('documents', this)"><i class="fas fa-paperclip" style="margin-right:4px;"></i>Documents</button>
          </div>
          <div id="tab-attendance" class="tab-panel active">
            ${attendance.length ? `<table class="table-clean"><thead><tr><th>Date</th><th>Time In</th></tr></thead><tbody>
              ${attendance.map((a) => `<tr><td>${a.date}</td><td>${a.time_in || '—'}</td></tr>`).join('')}
            </tbody></table>` : '<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No attendance in the last 30 days.</p></div>'}
          </div>
          <div id="tab-contracts" class="tab-panel">
            ${contracts.length ? `<table class="table-clean"><thead><tr><th>Amount</th><th>Start</th><th>End</th><th></th></tr></thead><tbody>
              ${contracts.map((c) => `
                <tr>
                  <td style="font-weight:700;color:#10b981;">₹${c.amount}</td>
                  <td>${c.date_start}</td>
                  <td>${c.date_end || 'No end'}</td>
                  <td><button onclick="downloadContractPdf(${c.id})" class="btn-outline-sm" style="padding:0.25rem 0.6rem;font-size:0.72rem;"><i class="fas fa-file-pdf"></i></button></td>
                </tr>
              `).join('')}
            </tbody></table>` : '<div class="empty-state"><i class="fas fa-file-contract"></i><p>No contracts yet.</p></div>'}
          </div>
          <div id="tab-notes" class="tab-panel">
            <div style="padding:1.25rem;">
              <form id="noteForm" style="display:flex;gap:0.5rem;margin-bottom:1rem;">
                <textarea id="noteInput" rows="2" placeholder="Add a note about this member..." style="flex:1;"></textarea>
                <button type="submit" class="btn-primary-sm" style="align-self:flex-end;"><i class="fas fa-plus"></i> Add</button>
              </form>
              ${notes.length ? notes.map((n) => `
                <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:0.85rem 1rem;margin-bottom:0.6rem;">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;">
                    <div style="font-size:0.875rem;color:#92400e;white-space:pre-wrap;">${escapeHtml(n.note)}</div>
                    <button onclick="deleteNote(${n.id})" style="background:none;border:none;color:#b45309;cursor:pointer;flex-shrink:0;"><i class="fas fa-times"></i></button>
                  </div>
                  <div style="font-size:0.7rem;color:#a16207;margin-top:0.4rem;">${n.author_name || 'Unknown'} — ${new Date(n.created_at).toLocaleString()}</div>
                </div>
              `).join('') : '<div class="empty-state" style="padding:2rem 0;"><i class="fas fa-sticky-note"></i><p>No notes for this member.</p></div>'}
            </div>
          </div>
          <div id="tab-documents" class="tab-panel">
            <div style="padding:1.25rem;">
              <div style="margin-bottom:1rem;">
                <button onclick="document.getElementById('documentInput').click()" class="btn-outline-sm"><i class="fas fa-upload"></i> Upload Document</button>
                <input type="file" id="documentInput" style="display:none;">
              </div>
              ${documents.length ? `<table class="table-clean"><thead><tr><th>File</th><th>Uploaded</th><th></th></tr></thead><tbody>
                ${documents.map((d) => `
                  <tr>
                    <td><i class="fas fa-file-alt" style="color:#94a3b8;margin-right:6px;"></i>${escapeHtml(d.original_name)}</td>
                    <td style="color:#64748b;font-size:0.8rem;">${new Date(d.uploaded_at).toLocaleString()}</td>
                    <td style="text-align:right;">
                      <a href="${BASE_ORIGIN}/uploads/${d.file_path}" target="_blank" class="btn-outline-sm" style="padding:0.25rem 0.6rem;font-size:0.75rem;"><i class="fas fa-download"></i></a>
                      <button onclick="deleteDocument(${d.id})" class="btn-outline-sm" style="padding:0.25rem 0.6rem;font-size:0.75rem;color:#ef4444;border-color:#ef4444;"><i class="fas fa-trash-alt"></i></button>
                    </td>
                  </tr>
                `).join('')}
              </tbody></table>` : '<div class="empty-state"><i class="fas fa-paperclip"></i><p>No documents uploaded for this member.</p></div>'}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('photoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
      await fetch(`${API_BASE}/members/${memberId}/photo`, {
        method: 'POST', body: formData,
        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` },
      });
      load();
    } catch (err) { alert(err.message); }
  });

  document.getElementById('deviceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api.post(`/members/${memberId}/set-device-id`, { device_user_id: document.getElementById('deviceIdInput').value });
      load();
    } catch (err) { alert(err.message); }
  });

  document.getElementById('noteForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('noteInput');
    if (!input.value.trim()) return;
    await api.post(`/members/${memberId}/notes`, { note: input.value });
    load();
  });

  document.getElementById('documentInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
      await fetch(`${API_BASE}/members/${memberId}/documents`, {
        method: 'POST', body: formData,
        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` },
      });
      load();
    } catch (err) { alert(err.message); }
  });
}

async function deleteNote(id) {
  await api.del(`/members/${memberId}/notes/${id}`);
  load();
}

async function deleteDocument(id) {
  await api.del(`/members/${memberId}/documents/${id}`);
  load();
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

async function deletePhoto() {
  await api.del(`/members/${memberId}/photo`);
  load();
}

async function downloadContractPdf(contractId) {
  const res = await fetch(`${API_BASE}/members/${memberId}/contracts/${contractId}/pdf`, {
    headers: { Authorization: `Bearer ${localStorage.getItem('token')}` },
  });
  if (!res.ok) { alert('Failed to download contract PDF.'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `contract-${contractId}.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}

async function openContractModal() {
  const today = new Date().toISOString().slice(0, 10);

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="contractModal">
      <div class="modal-box">
        <h3><i class="fas fa-file-contract" style="color:#dc2626;margin-right:8px;"></i>New Contract</h3>
        <form id="contractForm">
          <div style="margin-bottom:0.75rem;"><label class="form-label">Amount (₹) *</label><input id="cAmount" type="number" min="0" step="0.01" required></div>
          <div style="display:flex;gap:0.75rem;margin-bottom:0.75rem;">
            <div style="flex:1;"><label class="form-label">Start Date</label><input id="cDateStart" type="date" value="${today}"></div>
            <div style="flex:1;"><label class="form-label">End Date</label><input id="cDateEnd" type="date"></div>
          </div>
          <div style="margin-bottom:0.75rem;"><label class="form-label">Notes</label><textarea id="cNote" rows="2"></textarea></div>
          <p class="error" id="contractError" style="display:none;"></p>
          <div class="modal-actions">
            <button type="button" class="btn-outline-sm" onclick="document.getElementById('contractModal').remove()">Cancel</button>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-save"></i> Create Contract</button>
          </div>
        </form>
      </div>
    </div>
  `);
  document.getElementById('contractModal').addEventListener('click', (e) => { if (e.target.id === 'contractModal') e.target.remove(); });
  document.getElementById('contractForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('contractError');
    try {
      await api.post(`/members/${memberId}/contracts`, {
        member_id: Number(memberId),
        amount: document.getElementById('cAmount').value,
        date_start: document.getElementById('cDateStart').value || today,
        date_end: document.getElementById('cDateEnd').value || null,
        option_ids: [],
        note: document.getElementById('cNote').value,
      });
      document.getElementById('contractModal').remove();
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

function openPhotoLightbox(url) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="photoLightbox" style="background:rgba(0,0,0,0.85);">
      <img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    </div>
  `);
  document.getElementById('photoLightbox').addEventListener('click', () => document.getElementById('photoLightbox').remove());
}

async function openQrModal() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="qrModal">
      <div class="modal-box" style="text-align:center;">
        <h3><i class="fas fa-qrcode" style="color:#dc2626;margin-right:8px;"></i>Photo Upload QR</h3>
        <p style="color:#64748b;font-size:0.85rem;">Ask the member to scan this with their phone to upload their own photo. Valid for 15 minutes.</p>
        <div id="qrContent" style="padding:1.5rem 0;"><i class="fas fa-spinner fa-spin"></i></div>
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn-outline-sm" onclick="document.getElementById('qrModal').remove()">Close</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('qrModal').addEventListener('click', (e) => { if (e.target.id === 'qrModal') e.target.remove(); });
  try {
    const { token } = await api.post(`/members/${memberId}/photo/qr-token`);
    const loc = new URL(window.location.origin);
    if (loc.hostname === 'localhost' || loc.hostname === '127.0.0.1') {
      loc.hostname = new URL(API_BASE).hostname; // phones can't resolve localhost/127.0.0.1 back to this machine
    }
    const uploadUrl = `${loc.origin}/mobile-upload.html?token=${token}`;
    // ponytail: QR bitmap rendered via a public image API instead of a bundled
    // QR-encoding library — swap for a self-hosted encoder if third-party
    // network calls from the admin's browser are a concern.
    document.getElementById('qrContent').innerHTML = `
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(uploadUrl)}" style="border-radius:10px;">
      <div style="margin-top:0.75rem;"><a href="${uploadUrl}" target="_blank" style="font-size:0.78rem;color:#dc2626;word-break:break-all;">${uploadUrl}</a></div>
    `;
  } catch (err) {
    document.getElementById('qrContent').innerHTML = `<p class="error">${err.message}</p>`;
  }
}

async function openEditModal() {
  const m = currentMember;
  let plans = [];
  try { plans = (await api.get('/plans')).filter((p) => p.is_active); } catch (e) { /* ignore */ }
  const today = new Date().toISOString().slice(0, 10);

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="editModal">
      <div class="modal-box" style="max-width:560px;max-height:90vh;overflow-y:auto;">
        <h3><i class="fas fa-pen" style="color:#dc2626;margin-right:8px;"></i>Edit Member Details</h3>
        <form id="editForm">
          <div style="display:flex;gap:0.75rem;margin-bottom:0.75rem;">
            <div style="flex:1;"><label class="form-label">First Name</label><input id="editFirstName" value="${escapeHtml(m.first_name)}"></div>
            <div style="flex:1;"><label class="form-label">Last Name</label><input id="editLastName" value="${escapeHtml(m.last_name)}"></div>
          </div>
          <div style="margin-bottom:0.75rem;"><label class="form-label">Email *</label><input id="editEmail" type="email" value="${escapeHtml(m.email)}" required></div>
          <div style="display:flex;gap:0.75rem;margin-bottom:0.75rem;">
            <div style="flex:1;"><label class="form-label">Phone</label><input id="editPhone" type="tel" value="${escapeHtml(m.phone)}"></div>
            <div style="flex:1;"><label class="form-label">Gender</label>
              <select id="editGender">
                <option value="1" ${m.gender === '1' ? 'selected' : ''}>Male</option>
                <option value="2" ${m.gender === '2' ? 'selected' : ''}>Female</option>
              </select>
            </div>
            <div style="flex:1;"><label class="form-label">Date of Birth</label><input id="editBirthdate" type="date" value="${m.birthdate || ''}"></div>
          </div>

          <div style="border-top:1px solid #f1f5f9;margin:1rem 0 0.75rem;padding-top:0.75rem;">
            <label class="form-label">Add / Renew Membership Plan (optional)</label>
            ${plans.length ? `
              <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;">
                ${plans.map((p) => `
                  <label style="cursor:pointer;">
                    <input type="radio" name="editPlanRadio" value="${p.id}" data-price="${p.price}" data-days="${p.duration_days}" style="display:none;" class="edit-plan-radio">
                    <div class="plan-card-sel" style="border:1.5px solid #e2e8f0;border-radius:10px;padding:0.6rem 0.85rem;font-size:0.8rem;">
                      <strong>${escapeHtml(p.name)}</strong> — ₹${p.price} / ${p.duration_days}d
                    </div>
                  </label>
                `).join('')}
              </div>` : '<div style="font-size:0.8rem;color:#94a3b8;margin-bottom:0.75rem;">No active plans — create one from Membership Plans.</div>'}
            <div style="display:flex;gap:0.75rem;">
              <div style="flex:1;"><label class="form-label">Start Date</label><input id="editDateStart" type="date" value="${today}"></div>
              <div style="flex:1;"><label class="form-label">End Date</label><input id="editDateEnd" type="date"></div>
              <div style="flex:1;"><label class="form-label">Fee (₹)</label><input id="editFee" type="number" step="0.01" placeholder="uses plan price"></div>
            </div>
          </div>

          <p class="error" id="editError" style="display:none;"></p>
          <div class="modal-actions">
            <button type="button" class="btn-outline-sm" onclick="document.getElementById('editModal').remove()">Cancel</button>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-save"></i> Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  `);
  document.getElementById('editModal').addEventListener('click', (e) => { if (e.target.id === 'editModal') e.target.remove(); });
  document.querySelectorAll('.edit-plan-radio').forEach((radio) => {
    radio.addEventListener('change', function () {
      document.querySelectorAll('#editModal .plan-card-sel').forEach((c) => { c.style.borderColor = '#e2e8f0'; c.style.background = ''; });
      this.nextElementSibling.style.borderColor = '#dc2626';
      this.nextElementSibling.style.background = 'rgba(220,38,38,0.05)';
      const feeInput = document.getElementById('editFee');
      if (!feeInput.value) feeInput.value = this.dataset.price;
      const start = document.getElementById('editDateStart').value;
      if (start) {
        const d = new Date(start);
        d.setDate(d.getDate() + Number(this.dataset.days));
        document.getElementById('editDateEnd').value = d.toISOString().slice(0, 10);
      }
    });
  });
  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('editError');
    const selectedPlan = document.querySelector('.edit-plan-radio:checked');
    const feeVal = document.getElementById('editFee').value;
    try {
      await api.put(`/members/${memberId}`, {
        first_name: document.getElementById('editFirstName').value,
        last_name: document.getElementById('editLastName').value,
        email: document.getElementById('editEmail').value,
        phone: document.getElementById('editPhone').value,
        gender: document.getElementById('editGender').value,
        birthdate: document.getElementById('editBirthdate').value || null,
      });
      if (selectedPlan || feeVal) {
        await api.post(`/members/${memberId}/contracts`, {
          member_id: Number(memberId),
          amount: feeVal || selectedPlan.dataset.price,
          plan_id: selectedPlan ? Number(selectedPlan.value) : null,
          contract_type_id: null,
          date_start: document.getElementById('editDateStart').value || today,
          date_end: document.getElementById('editDateEnd').value || null,
          option_ids: [],
          note: '',
        });
      }
      document.getElementById('editModal').remove();
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

function confirmDelete() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop-custom" id="deleteModal">
      <div class="modal-box">
        <h3>Delete Member?</h3>
        <p>This will permanently delete this member and all their data. This cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn-outline-sm" onclick="document.getElementById('deleteModal').remove()">Cancel</button>
          <button style="background:#ef4444;color:#fff;border:none;padding:0.45rem 1rem;border-radius:8px;font-weight:700;cursor:pointer;" onclick="doDelete()">Delete</button>
        </div>
      </div>
    </div>
  `);
}
async function doDelete() {
  await api.del(`/members/${memberId}`);
  window.location.href = '/members.html';
}

function load() {
  Promise.all([
    api.get(`/members/${memberId}`),
    api.get(`/members/${memberId}/contracts`),
    api.get('/members'),
    api.get('/attendance'),
    api.get(`/members/${memberId}/notes`),
    api.get(`/members/${memberId}/documents`),
  ]).then(([member, contracts, all, allAttendance, notes, documents]) => {
    const found = all.find((m) => String(m.id) === String(memberId));
    const since = new Date(); since.setDate(since.getDate() - 30);
    const sinceIso = since.toISOString().slice(0, 10);
    const myAttendance = allAttendance.filter((a) => a.member_id === Number(memberId) && a.date >= sinceIso);
    render(member, contracts, found ? found.status : 'inactive', myAttendance, notes, documents);
  }).catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
}

load();
</script>
</body>
</html>
