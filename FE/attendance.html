<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance — wger</title>
<link rel="stylesheet" href="/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('attendance', 'Biometric Attendance');
let members = [];

function render(records) {
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = records.filter((r) => r.date === today).length;
  const memberById = Object.fromEntries(members.map((m) => [m.id, m]));

  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div><div style="font-size:1.3rem;font-weight:800;color:#0f172a;">Attendance Tracker</div><div style="color:#64748b;font-size:0.82rem;">${todayCount} check-ins today</div></div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-xl-3"><div class="stat-card" style="padding:1rem;"><div class="stat-icon green" style="width:44px;height:44px;font-size:1rem;"><i class="fas fa-sign-in-alt"></i></div><div><div class="stat-value" style="font-size:1.4rem;">${todayCount}</div><div class="stat-label">Today Total</div></div></div></div>
      <div class="col-12 col-sm-6 col-xl-3"><div class="stat-card" style="padding:1rem;"><div class="stat-icon blue" style="width:44px;height:44px;font-size:1rem;"><i class="fas fa-calendar-day"></i></div><div><div class="stat-value" style="font-size:1.4rem;">${records.length}</div><div class="stat-label">All Records</div></div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="card">
          <div class="card-header-plain"><h6><i class="fas fa-fingerprint" style="color:#dc2626;margin-right:8px;"></i>Manual Punch</h6></div>
          <div class="card-body-pad">
            <p style="font-size:0.8rem;color:#64748b;margin-bottom:1rem;">Select a member to mark them present.</p>
            <form id="punchForm">
              <div style="margin-bottom:0.75rem;">
                <label class="form-label">Select Member</label>
                <select id="memberSelect" required><option value="">— Choose member —</option>${members.map((m) => `<option value="${m.id}">${escapeHtml(m.username)}</option>`).join('')}</select>
              </div>
              <div style="margin-bottom:0.75rem;"><label class="form-label">Date</label><input id="dateInput" type="date" value="${today}" required></div>
              <div style="margin-bottom:0.75rem;"><label class="form-label">Time In</label><input id="timeInput" type="time"></div>
              <p class="error" id="pError" style="display:none;"></p>
              <button type="submit" class="btn-success-sm" style="width:100%;padding:0.6rem;"><i class="fas fa-sign-in-alt" style="margin-right:6px;"></i>Mark Present</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="card">
          <div class="card-header-plain"><h6><i class="fas fa-list" style="color:#10b981;margin-right:8px;"></i>All Records</h6><span style="font-size:0.75rem;color:#64748b;">${records.length} records</span></div>
          ${records.length ? `<div style="overflow-x:auto;"><table class="table-clean"><thead><tr><th>Member</th><th>Date</th><th>Time In</th></tr></thead><tbody>
            ${records.map((r) => `<tr>
              <td><div style="display:flex;align-items:center;gap:10px;">
                <div class="member-avatar" style="width:30px;height:30px;font-size:0.7rem;">${(memberById[r.member_id]?.username || '?').slice(0,2).toUpperCase()}</div>
                <div style="font-weight:600;font-size:0.85rem;">${escapeHtml(memberById[r.member_id]?.username || ('#' + r.member_id))}</div>
              </div></td>
              <td style="color:#64748b;font-size:0.8rem;">${r.date}</td>
              <td>${r.time_in ? `<span style="font-weight:600;color:#10b981;">${r.time_in}</span>` : '<span style="color:#94a3b8;">—</span>'}</td>
            </tr>`).join('')}
          </tbody></table></div>` : '<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No attendance records yet.</p></div>'}
        </div>
      </div>
    </div>
  `;

  document.getElementById('punchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('pError');
    try {
      await api.post('/attendance', {
        member_id: Number(document.getElementById('memberSelect').value),
        date: document.getElementById('dateInput').value,
        time_in: document.getElementById('timeInput').value || null,
      });
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

function load() {
  Promise.all([api.get('/attendance'), api.get('/members')])
    .then(([records, m]) => { members = m; render(records); })
    .catch((err) => { document.getElementById('pageBody').innerHTML = `<p class="error">${err.message}</p>`; });
}

load();
</script>
</body>
</html>
